name: Herdr1 Windows (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc
      - name: Instalar Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: 0.16.0
      - name: Testar cores dos indicadores
        run: cargo test --locked --target x86_64-pc-windows-msvc status_marker_tests
      - name: Compilar Herdr1
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Guardar executavel experimental
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Herdr1-experimental-windows-x64
          path: target/x86_64-pc-windows-msvc/release/herdr.exe
          if-no-files-found: error
          retention-days: 7
